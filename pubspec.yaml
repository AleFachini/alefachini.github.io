name: portfolio
description: "Ale Fachini's portfolio web app — Flutter Web deployed to GitHub Pages."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0-210.2.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  youtube_player_iframe: ^5.2.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/profile/
    - assets/images/certificates/
    - assets/pdfs/certificates/
